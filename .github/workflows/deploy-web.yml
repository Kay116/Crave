name: Deploy web demo

# Builds the Expo web export and publishes it to GitHub Pages on every push to
# version-4 (and on demand). One-time setup in the repo:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   Settings -> Secrets and variables -> Actions -> add:
#     EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#     (optional) EXPO_PUBLIC_GOOGLE_PLACES_API_KEY
# With no secrets the demo still runs in guest-only mode.

on:
  push:
    branches: [version-4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Export web build
        env:
          # Repo is served from https://<user>.github.io/Crave/
          EXPO_BASE_URL: /Crave
          EXPO_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_APP_URL || format('https://{0}.github.io/Crave', github.repository_owner) }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_API_KEY }}
        run: npx expo export --platform web

      - name: SPA fallback + Pages fixups
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
